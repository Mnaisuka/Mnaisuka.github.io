name: Python-debug
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 17 * * *"

jobs:
  job_update:
    name: Python Crawler
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # 允许后续 push 回 main
          ref: main
      - name: "指定python环境"
        uses: actions/setup-python@v5
        with:
          # 用 3.11 让它自动选最新的 3.11.x 补丁版本，
          # 避免 ubuntu-latest 上没有 3.11.9 精确版本缓存而报错
          python-version: "3.11"
      - name: "安装运行环境"
        run: pip install requests
      - name: "检查目录"
        run: ls
      - name: "TLD自动更新"
        env:
          GH_TOKEN: ${{ secrets.BIG_TOKEN }}
        run: python thelongdark/index.py
      - name: "检查目录"
        run: ls
      - name: "提交更新"
        run: |
          git config --local user.email "2567810193@qq.com"
          git config --local user.name "Mnaisuka"
          git pull --rebase origin main
          git add thelongdark/
          if git diff --cached --quiet; then
            echo "没有文件变化"
          else
            echo "正在推送更新"
            git commit -m "update"
            git push origin main
          fi

  deploy: #--------------------
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: true
    needs: job_update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: "拉取最新内容"
        run: |
          git config --local user.email "2567810193@qq.com"
          git config --local user.name "Mnaisuka"
          git pull --rebase origin main
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
